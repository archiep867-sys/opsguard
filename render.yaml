services:
  - type: web
    name: opsguard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: OPSGUARD_DB_PATH
        value: /tmp/opsguard_audit.sqlite3
